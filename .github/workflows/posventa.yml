name: Posventa diaria

on:
  schedule:
    # UTC: 13:00 = 10:00 America/Argentina/Buenos_Aires.
    # GitHub may delay scheduled jobs. This is not an exact-time guarantee.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posventa-diaria
  cancel-in-progress: false

jobs:
  posventa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Leer únicamente el repositorio del temporizador
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar el ejecutable sin red
        run: node --test test/runner.test.mjs
      - name: Ejecutar una sola llamada
        env:
          # Missing variable is deliberately probe-only, never dispatch.
          POSTVENTA_MODE: ${{ vars.POSTVENTA_MODE || 'probe' }}
          POSTVENTA_PUBLIC_ORIGIN: ${{ vars.POSTVENTA_PUBLIC_ORIGIN }}
          POSTVENTA_SERVICE_TOKEN: ${{ secrets.POSTVENTA_SERVICE_TOKEN }}
        run: node runner.mjs
